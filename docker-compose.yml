# Hindsight self-hosted stack for Coolify
# ----------------------------------------
# Three services in one Coolify resource:
#   - postgres                : PostgreSQL 17 + pgvector (the "included" database)
#   - hindsight-api           : data plane / API + MCP server + worker (port 8888)
#   - hindsight-control-plane : web UI (port 9999)
#
# Coolify magic variables used here:
#   SERVICE_URL_<ID>_<PORT>   -> Coolify generates a public URL + TLS and routes
#                                its proxy (Traefik/Caddy) to that container port.
#   SERVICE_PASSWORD_<ID>     -> Coolify auto-generates a random secret, reuses the
#                                same value across services, and shows it (editable)
#                                in the UI. No need to set these by hand.
#
# Inline comments on each variable below appear in Coolify's per-variable
# "Comment" field (Coolify only reads inline comments, not full-line ones).

services:
  postgres:
    # Pinned: pgvector 0.8.0 on PostgreSQL 17.
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hindsight}  # Database user, created on first init
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}  # Auto-generated by Coolify; reused in the API connection string
      POSTGRES_DB: ${POSTGRES_DB:-hindsight}  # Database name, created on first init
    volumes:
      - hindsight-pgdata:/var/lib/postgresql/data
      # Enables the required extensions on first DB creation (idempotent).
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hindsight} -d ${POSTGRES_DB:-hindsight}"]
      interval: 5s
      timeout: 5s
      retries: 20

  hindsight-api:
    image: ghcr.io/vectorize-io/hindsight-api:${HINDSIGHT_VERSION:-0.7.1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SERVICE_URL_HINDSIGHTAPI_8888  # Public URL Coolify generates for the API / MCP endpoint (proxied to port 8888)
      - HINDSIGHT_API_DATABASE_URL=postgresql://${POSTGRES_USER:-hindsight}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-hindsight}  # Connection string to the bundled Postgres
      - HINDSIGHT_API_VECTOR_EXTENSION=${HINDSIGHT_API_VECTOR_EXTENSION:-pgvector}  # Vector search backend; matches the pgvector image
      - HINDSIGHT_API_RUN_MIGRATIONS_ON_STARTUP=true  # Apply database migrations automatically on startup
      - HINDSIGHT_API_LLM_PROVIDER=${HINDSIGHT_API_LLM_PROVIDER:-anthropic}  # LLM provider: openai, anthropic, gemini, groq, ollama, bedrock, openrouter, none, ... (see README)
      - HINDSIGHT_API_LLM_MODEL=${HINDSIGHT_API_LLM_MODEL:-claude-sonnet-4-5-20250929}  # Model id for the selected provider
      - HINDSIGHT_API_LLM_API_KEY=${HINDSIGHT_API_LLM_API_KEY:?provide your LLM provider API key}  # REQUIRED: API key for the LLM provider (e.g. your Anthropic key)
      - HINDSIGHT_API_EMBEDDINGS_PROVIDER=${HINDSIGHT_API_EMBEDDINGS_PROVIDER:-local}  # Embeddings backend; 'local' runs in-container (wants ~2-4GB RAM)
      - HINDSIGHT_API_RERANKER_PROVIDER=${HINDSIGHT_API_RERANKER_PROVIDER:-local}  # Reranker backend; 'local' runs in-container
      - HINDSIGHT_API_WORKER_ID=${HINDSIGHT_API_WORKER_ID:-hindsight-worker-1}  # Stable worker identity across restarts
      - HINDSIGHT_API_TENANT_EXTENSION=${HINDSIGHT_API_TENANT_EXTENSION:-hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension}  # API key gate; set empty to disable authentication on the API
      - HINDSIGHT_API_TENANT_API_KEY=${SERVICE_PASSWORD_TENANT}  # Auto-generated API key required on API/MCP requests; copy from the UI for external clients
      - HINDSIGHT_API_LOG_FORMAT=${HINDSIGHT_API_LOG_FORMAT:-json}  # Log output format: text or json
    expose:
      - "8888"
    volumes:
      # Persist downloaded embedding/reranker models so restarts don't re-download.
      - hindsight-models:/home/hindsight/.cache
    healthcheck:
      # /health checks the API + database connection (unauthenticated).
      # start_period is generous: first boot runs migrations and downloads the
      # local embedding/reranker models before the API is ready.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/health || wget -qO- http://localhost:8888/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  hindsight-control-plane:
    image: ghcr.io/vectorize-io/hindsight-control-plane:${HINDSIGHT_VERSION:-0.7.1}
    restart: unless-stopped
    depends_on:
      hindsight-api:
        condition: service_healthy
    environment:
      - SERVICE_URL_HINDSIGHTUI_9999  # Public URL Coolify generates for the web UI (proxied to port 9999)
      - HINDSIGHT_CP_DATAPLANE_API_URL=${HINDSIGHT_CP_DATAPLANE_API_URL:-http://hindsight-api:8888}  # Internal URL the UI server uses to reach the API
      - HINDSIGHT_CP_ACCESS_KEY=${SERVICE_PASSWORD_CPACCESS}  # Auto-generated UI login key; copy it from the UI to sign in
      - HINDSIGHT_CP_DATAPLANE_API_KEY=${SERVICE_PASSWORD_TENANT}  # Same key as the API gate; lets the UI authenticate to the API
    expose:
      - "9999"
    healthcheck:
      # Probes the UI's public /api/health route (exempt from the access-key login).
      # node is always present in this Next.js image; fetch is global in Node 18+.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9999/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  hindsight-pgdata:
  hindsight-models:
